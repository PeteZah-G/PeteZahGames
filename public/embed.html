        function codecEncode(url) {
          if (!url) return url;
          var x = "";
          for (var i = 0; i < url.length; i++) {

        function parseHashUrl() {

          if (!raw) return "";
          try {

          if (!/^https?:\/\//i.test(raw)) {
            raw = "https://" + raw.replace(/^\/+/, "");
          }
          try {
            var u = new URL(raw);
            if (u.protocol !== "http:" && u.protocol !== "https:") return "";
            return u.href;
          } catch (e) {
            return "";

        }

        function waitFor(fn, ms) {
          return new Promise(function (resolve, reject) {
            var start = Date.now();
            var t = setInterval(function () {
              try {
                if (fn()) {

                  resolve();

          setStatus("Opening…");
          try {

            return;
          }
          var container = document.getElementById("iframe-container");
          container.innerHTML = "";
          frame = engine[makeFrame]();
          container.appendChild(frame.frame);
          frame.frame.addEventListener("load", function () {
            setStatus("");
          });
          document.title = url.replace(/^https?:\/\//i, "").split("/")[0] || "PeteZah";
          try {
            frame.go(url);
          } catch (e) {
            setStatus("Could not open that page.");
            return;
          }
          setTimeout(function () {
            setStatus("");
          }, 2500);
        }

        window.addEventListener("hashchange", function () {

        if (document.readyState === "complete" || document.readyState === "interactive") {
