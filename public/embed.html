<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PeteZah</title>
    <link rel="icon" href="/logo.png" />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #020810;
        color: #a8b8cc;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #iframe-container {
        width: 100%;
        height: 100%;
      }
      #iframe-container iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: #fff;
      }
      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        z-index: 2;
        background: #020810;
        transition: opacity 0.2s ease;
      }
      #status.hide {
        opacity: 0;
      }
      #status p {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.02em;
      }
    </style>
    <script src="/m4thx/index.js"></script>
    <script src="/q9vx/sj.all.js"></script>
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="status"><p>Loading…</p></div>
    <div id="iframe-container"></div>
    <script>
      (function () {
        function c(a) {
          return a.map(function (n) {
            return String.fromCharCode(n);
          }).join("");
        }
        var loadCtrl = c([36, 100, 117, 115, 107, 108, 105, 110, 101, 76, 111, 97, 100, 67, 111, 110, 116, 114, 111, 108, 108, 101, 114]);
        var ctrlName = c([68, 117, 115, 107, 108, 105, 110, 101, 67, 111, 110, 116, 114, 111, 108, 108, 101, 114]);
        var muxName = c([67, 108, 105, 112, 77, 117, 120]);
        var muxConn = c([67, 108, 105, 112, 77, 117, 120, 67, 111, 110, 110, 101, 99, 116, 105, 111, 110]);
        var setT = c([98, 105, 110, 100, 84, 114, 97, 110, 115, 102, 101, 114]);
        var streamKey = c([108, 105, 110, 107]);
        var makeFrame = c([111, 112, 101, 110, 83, 117, 114, 102, 97, 99, 101]);

        var factory = window[loadCtrl];
        var packed = factory();
        var Ctrl = packed[ctrlName];
        var engine = new Ctrl({
          prefix: "/afsd123k2/",
          files: {
            wasm: "/q9vx/sj.wasm.wasm",
            all: "/q9vx/sj.all.js",
            sync: "/q9vx/sj.sync.js",
          },
        });

        var Mux = window[muxName];
        var connection = new Mux[muxConn]("/m4thx/worker.js");

        var store = {
          streamurl:
            (typeof _CONFIG !== "undefined" && _CONFIG.streamurl) ||
            (location.protocol === "https:" ? "wss" : "ws") +
              "://" +
              location.host +
              "/api/websocket/",
          bareurl:
            (typeof _CONFIG !== "undefined" && _CONFIG.bareurl) ||
            location.protocol + "//" + location.host + "/api/edge/",
        };

        var readyPromise = null;
        var frame = null;

        function setStatus(text) {
          var el = document.getElementById("status");
          if (!el) return;
          if (!text) {
            el.classList.add("hide");
            return;
          }
          el.classList.remove("hide");
          el.querySelector("p").textContent = text;
        }

        function parseHashUrl() {
          var raw = window.location.hash.slice(1).trim();
          if (!raw) return "";
          try {
            raw = decodeURIComponent(raw);
          } catch (e) {}
          if (!/^https?:\/\//i.test(raw)) {
            raw = "https://" + raw.replace(/^\/+/, "");
          }
          try {
            var u = new URL(raw);
            if (u.protocol !== "http:" && u.protocol !== "https:") return "";
            return u.href;
          } catch (e) {
            return "";
          }
        }

        async function ensureReady() {
          if (readyPromise) return readyPromise;
          readyPromise = (async function () {
            await engine.init();
            try {
              await navigator.serviceWorker.register("/1k123.js", {
                updateViaCache: "none",
                scope: "/",
              });
              await navigator.serviceWorker.ready;
            } catch (e) {}
            await waitForTransport();
          })();
          return readyPromise;
        }

        async function waitForTransport() {
          var attempts = 0;
          var maxAttempts = 12;
          while (attempts < maxAttempts) {
            try {
              var o1 = {};
              o1[streamKey] = store.streamurl;
              await connection[setT]("/e7px/index.mjs", [o1]);
              return;
            } catch (e1) {
              try {
                var o2 = {};
                o2[streamKey] = store.streamurl;
                await connection[setT]("/l9cx/index.mjs", [o2]);
                return;
              } catch (e2) {
                try {
                  await connection[setT]("/m4thx/index.mjs", [store.bareurl]);
                  return;
                } catch (e3) {
                  attempts++;
                  if (attempts >= maxAttempts) throw new Error("transport");
                  await new Promise(function (r) {
                    setTimeout(r, 120);
                  });
                }
              }
            }
          }
        }

        async function loadFromHash() {
          var url = parseHashUrl();
          if (!url) {
            setStatus("Add a URL after # — e.g. /embed.html#https://example.com");
            return;
          }
          setStatus("Opening…");
          try {
            await ensureReady();
          } catch (e) {
            setStatus("Could not start. Refresh and try again.");
            return;
          }
          var container = document.getElementById("iframe-container");
          container.innerHTML = "";
          frame = engine[makeFrame]();
          container.appendChild(frame.frame);
          document.title = url.replace(/^https?:\/\//i, "").split("/")[0] || "PeteZah";
          frame.go(url);
          setTimeout(function () {
            setStatus("");
          }, 400);
        }

        window.addEventListener("hashchange", function () {
          loadFromHash();
        });
        window.addEventListener("load", function () {
          loadFromHash();
        });
      })();
    </script>
  </body>
</html>
