<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title></title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020810;
    }
    #rain-background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
    }
    #rain-canvas {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .slide, .nav-item, .nosupport, .image-preload {
      display: none !important;
    }
  </style>
  <script>
    (function () {
      var allowed = {
        harbor: 1,
        trails: 1,
        aerial: 1,
        anime: 1,
        violet: 1,
        nebula: 1,
        bridges: 1,
      };
      var s = "harbor";
      try {
        s = new URLSearchParams(location.search).get("s") || "harbor";
      } catch (e) {}
      if (!allowed[s]) s = "harbor";
      var base = "/fx/rain/img/scenes/" + s + "/";
      window.__PZ_RAIN_FG__ = base + "fg.jpg";
      window.__PZ_RAIN_BG__ = base + "bg.jpg";
    })();
  </script>
</head>
<body>
  <div id="rain-background">
    <canvas id="rain-canvas" width="1" height="1" aria-hidden="true"></canvas>
    <div class="slide slide--current" id="slide-1" data-weather="rain"></div>
    <a class="nav-item nav-item--current" href="#slide-1" aria-hidden="true"></a>
  </div>
  <script src="/fx/rain/js/index.min.js"></script>
  <script src="/fx/rain/js/viewport-sync.js"></script>
  <script>
    (function () {
      function setPaused(p) {
        try {
          document.documentElement.style.visibility = p ? "hidden" : "visible";
        } catch (e) {}
      }
      document.addEventListener("visibilitychange", function () {
        setPaused(document.hidden);
      });
      window.addEventListener("message", function (e) {
        if (!e || !e.data) return;
        if (e.data.type === "pz-rain-pause") setPaused(!!e.data.value);
      });
    })();
  </script>
</body>
</html>
