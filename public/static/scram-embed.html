<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scramjet Embed</title>
    <link rel="icon" href="favicon.webp" />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000;
      }

      #iframe-container {
        width: 100%;
        height: 100%;
      }

      #iframe-container iframe {
        width: 100%;
        height: 100%;
        border: none;
        background-color: #fff;
      }
    </style>
    <script src="/m4thx/index.js"></script>
    <script src="/q9vx/sj.all.js"></script>
    <script src="/config.js"></script>
  </head>

  <body>
    <div id="iframe-container"></div>

    <script>
      const { ScramjetController } = $scramjetLoadController();
      const scramjet = new ScramjetController({
        prefix: '/afsd123k2/',
        files: {
          wasm: '/q9vx/sj.wasm.wasm',
          all: '/q9vx/sj.all.js',
          sync: '/q9vx/sj.sync.js'
        }
      });

      (async () => {
        await scramjet.init();
        try {
          await navigator.serviceWorker.register('/1k123.js', {
            updateViaCache: 'none',
            scope: '/'
          });
          await navigator.serviceWorker.ready;
        } catch (e) {}
      })();

      const connection = new BareMux.BareMuxConnection('/m4thx/worker.js');

      const store = {
        url: 'https://',
        wispurl:
          _CONFIG?.wispurl ||
          (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws-stream/',
        bareurl:
          _CONFIG?.bareurl ||
          (location.protocol === 'https:' ? 'https' : 'http') + '://' + location.host + '/api/edge/',
        proxy: '',
        transport: '/e7px/index.mjs'
      };

      async function loadFromHash() {
        const hash = window.location.hash.substring(1);

        if (hash) {
          let url = hash;

          if (!url.startsWith('http://') && !url.startsWith('https://')) {
            url = 'https://' + url;
          }

          await waitForTransport();

          const frame = scramjet.createFrame();
          document.getElementById('iframe-container').appendChild(frame.frame);

          frame.go(url);
        } else {
          await waitForTransport();
          const frame = scramjet.createFrame();
          document.getElementById('iframe-container').appendChild(frame.frame);
          frame.go('https://google.com/');
        }
      }

      async function waitForTransport() {
        let attempts = 0;
        const maxAttempts = 10;

        while (attempts < maxAttempts) {
          try {
            await connection.setTransport('/e7px/index.mjs', [{ wisp: store.wispurl }]);
            return;
          } catch (e) {
            try {
              await connection.setTransport('/m4thx/index.mjs', [store.bareurl]);
              return;
            } catch (e2) {
              try {
                await connection.setTransport('/l9cx/index.mjs', [{ wisp: store.wispurl }]);
                return;
              } catch (e3) {
                attempts++;
                if (attempts >= maxAttempts) {
                  console.error('Failed to set any transport after', maxAttempts, 'attempts');
                  throw new Error('No bare clients available');
                }
                await new Promise((resolve) => setTimeout(resolve, 100));
              }
            }
          }
        }
      }

      window.addEventListener('hashchange', async () => {
        const container = document.getElementById('iframe-container');
        container.innerHTML = '';

        await loadFromHash();
      });

      window.addEventListener('load', async () => {
        await loadFromHash();
      });
    </script>
  </body>
</html>
