# Paste these next to the existing `location ^~ /!!/` block in
# /etc/nginx/sites-enabled/petezah  (BEFORE the `location ~* \.(css|js|...)$` regex).
# Then: sudo nginx -t && sudo systemctl reload nginx

# Games. Browser sees /f/g/hs/host/path — Mochi still gets /!!/https://host/path
location ^~ /f/g/ {
    rewrite ^/f/g/hs/(.*)$ /!!/https://$1 break;
    rewrite ^/f/g/ht/(.*)$ /!!/http://$1 break;
    rewrite ^/f/g/(.*)$ /!!/$1 break;
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 5s;
    proxy_buffering off;
    proxy_request_buffering off;
}

# Cover images (same hop as /!cover!/)
location ^~ /f/c/ {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 5s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Connection "";
}
