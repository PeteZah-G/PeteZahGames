services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    ports:
      - "8096:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - /path/to/movies:/media/movies
      - /path/to/tv:/media/tv
    restart: unless-stopped
volumes:
  jellyfin-config:
  jellyfin-cache:
